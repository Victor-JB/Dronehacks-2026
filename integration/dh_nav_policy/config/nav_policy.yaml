# nav_policy parameters. Topic names are the repository's (main config/drone.yaml, 2026-11-07 bag).
nav_policy:
  ros__parameters:
    odometry_topic: /visual_slam/tracking/odometry
    state_topic: /skybeta/state
    vo_status_topic: /visual_slam/status
    depth_topic: /oak/stereo/image_raw          # NOT in the recorded bag: verify it is published before flight
    depth_info_topic: /oak/stereo/camera_info
    rgb_topic: ""                               # the team's OAK config publishes NO colour stream: target off
    base_frame: base_link
    rate_hz: 10.0
    # REQUIRED before any live run: the test area in the VIO frame (origin = where the stack started,
    # +x = nose at start), [xmin, xmax, ymin, ymax] metres. Left unset ([0.0]) the policy never moves sideways.
    geofence: [0.0]
    cruise_z: 0.75
    v_max: 0.35
    map_lo_xy: [-7.0, -7.0]
    map_size: 14.0
    # same names and values as main's config/drone.yaml (flown on the drone)
    odom_stale_s: 1.0                           # odometry older than this = unhealthy (real gaps 0.30-0.35 s)
    motion_check: true                          # main's motion check (commanded motion followed, VIO vs PX4 height)
    motion_err_m: 1.0
    motion_window_s: 5.0
    motion_min_progress_m: 0.1
    motion_z_mismatch_m: 0.8
    max_pose_dt_s: 0.05                         # map a depth frame only with odometry within this of its stamp
    brake_decel: 1.0                            # PLACEHOLDER until measured
    latency_s: 0.8                              # PLACEHOLDER until measured
