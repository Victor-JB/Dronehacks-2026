# Default parameters. Values marked (MEASURE) must be checked on the issued drone.
dh_mission:
  ros__parameters:
    course_obj: /root/team_ws/course/dronehacks-course-v3.obj   # download from the Challenge page
    backend: skybeta              # skybeta = organizers' API; px4 = direct (SITL / only if allowed)
    route: window                 # gate | window | auto
    planner: fillet               # fillet (fastest in tests) | sfc (corridor + min-jerk QP) | mpl (motion primitives)
    corner: clothoid              # fillet corners: clothoid (continuous curvature, 0 touches in SIL) | arc (old)
    a_total: 1.5                  # combined along+lateral acceleration limit (m/s^2)
    window_straight: 0.6          # m of straight path required each side of the window plane
    cruise_z: 0.85                # inside window (0.305-1.219 m); tube widest at 0.94 m
    robot_radius: 0.27            # (MEASURE) half tip-to-tip span + margin
    v_max: 0.85                   # planned speed; keep below v_cap for tracking headroom
    v_cap: 1.0                    # PX4 MPC_XY_VEL_MAX on the bench drone
    v_narrow: 0.5
    v_dark: 0.85                  # do NOT slow down in the dark tube (drift grows with time)
    a_max: 1.5
    a_lat: 1.5
    launch_yaw_map: 1.5708        # drone placed on the launch mark facing north (+Y)
    align_mode: start             # first_odom if the stack is started with the drone on the mark
    autostart_on_offboard: false
    enable_return: false          # needs autonomous re-arm (backend px4) - see STRATEGY.md
    return_z: 2.05
    correction_gain: 0.5
    line_gain: 0.3
    min_forward_clearance: 0.45
    land_hover_z: 0.35
dh_localizer:
  ros__parameters:
    course_obj: /root/team_ws/course/dronehacks-course-v3.obj
    scan_topic: /dh/stereo_scan   # or a 2D LiDAR's /scan
    sensor_x: 0.0                 # 0 for stereo_scan (body-relative); set to the LiDAR x offset if scan_topic is a LiDAR
dh_stereo_scan:
  ros__parameters:
    camera_pitch_deg: 20.0        # (MEASURE) from /etc/skybeta/drone.env camera mount
    camera_x: 0.10
    camera_z: -0.02
    scale: 0.5
    num_disparities: 64
    rectify_source: auto          # camera_info (if it has a baseline) -> TF left->right -> assumed baseline
    baseline: 0.0                 # >0 forces the baseline (m); OAK-D S2 nominal 0.075
dh_line:
  ros__parameters:
    camera_pitch_deg: 20.0        # (MEASURE)
    dark_delta: 25                # black-hat threshold; check on the real floor (echo /dh/line_obs over the line)
