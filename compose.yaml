name: dronehacks-sim
services:
  sim:
    image: dronehacks-sim:local
    build: .
    init: true
    shm_size: 256m
    environment:
      SIM_WORLD: ${SIM_WORLD:-worlds/course.sdf}
      SIM_GUI: ${SIM_GUI:-1}
      SIM_MISSION: ${SIM_MISSION:-1}
      SIM_COURSE: "${SIM_COURSE:-mission/course.json}"
      SIM_SPEED_SCALE: "${SIM_SPEED_SCALE:-0.65}"
    ports:
      - "127.0.0.1:${GZ_GUI_PORT:-8080}:6080"
    volumes:
      - .:/workspace:ro
      - ./artifacts:/workspace/artifacts
