/**:
  ros__parameters:
    use_sim_time: false
    # On-device OAK stereo depth, enabled by the team image (skybeta_overrides/):
    # 16UC1 millimetres, 320x200 after the OAK's 2x decimation, 30 Hz.
    depth_topic: /oak/stereo/image_raw
    depth_info_topic: /oak/stereo/camera_info
    # refnav's depth defaults are sized for a 1280x800 image; this one is 4x smaller
    # per side, so pixel counts scale by 1/4 and areas by 1/16.
    depth_stride: 4             # was 8: keeps ~4000 sampled rays per frame
    depth_border_px: 6          # was 24
    min_obstacle_px: 75         # was 1200 (~35 x 35 px at 1280x800 -> ~9 x 9 px here)
    base_frame: base_link
    status_topic: /refnav/status
    # The stack starts this node at power-up (autonomy_pipeline.md): it waits as long as it takes,
    # holds a setpoint from READY on, and flies when the pilot arms on Altitude and switches to
    # Position. PX4 still disarms 10 s after arming without a takeoff (COM_DISARM_PRFLT), so the
    # pilot switches within a few seconds of arming.
    wait_s: 0.0                 # 0: never give up waiting for READY
    arm_wait_s: 0.0             # 0: never give up waiting for the pilot after READY
    exit_when_done: false       # after a run, once disarmed: a fresh mission for the next arming
    # After the takeoff, hover until START ROUTE is pressed in the live view (fly.sh start prints the
    # link); no START within start_wait_s ends the mission (it lands itself). Modes with
    # no route (hover_test) are not gated.
    start_gate: true
    # 2026-11-07: no START within 10 s of the button turning on -> it lands itself (the pilot does not have to)
    start_wait_s: 10.0
    # Odometry older than this = estimator unhealthy. 0.3 s tripped on the drone (bags of 2026-11-07):
    # cuVSLAM's odometry has gaps of 0.30-0.35 s (dropped camera frames), 16 in 68 s without depth and
    # 118 in 264 s with it, while it kept tracking and PX4 kept its position; each gap ended the
    # mission before the pilot could arm. 0.5 s still fails closed on a real dropout.
    # 2026-11-07 21:00: a 0.6 s stall of the whole stack ended a run before takeoff; 1.0 s rides through it.
    odom_stale_s: 1.0
    # Motion check (dronehacks_nav/motion_check.py): while Offboard is ours, a setpoint more than
    # motion_err_m away for motion_window_s must move the vehicle motion_min_progress_m toward it,
    # and VIO's height change must match PX4's rangefinder within motion_z_mismatch_m. Otherwise
    # the node freezes where the odometry says it is and asks the pilot to take over.
    motion_check: true
    # Loosened 2026-11-07 21:00: it froze a good takeoff (VIO +0.43 m vs rangefinder +0.74 m over 3 s of climb).
    # Still trips on a VIO blow-up (metres off), which is what it is for.
    motion_err_m: 1.0
    motion_window_s: 5.0
    motion_min_progress_m: 0.1
    motion_z_mismatch_m: 0.8
